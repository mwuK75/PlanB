<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanB - ホーム</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-home">

<div id="app-container">
    <header>
        <a href="index.html" class="logo">
            <img src="fig/head.png" alt="PlanB" class="header-logo">
        </a>
        <div class="header-actions">
            <button class="btn-transparent" onclick="window.location.href='explain.html'">アプリの説明</button>
            <button class="btn-transparent" onclick="handleLogout()">ログアウト</button>
        </div>
    </header>

    <main>
        <div id="phase-home">
            <div class="hero-section">
                <div class="hero-text">
                    <h2>予定、崩れちゃった？</h2>
                    <p>現在地からベストな「代わりのプラン」を即座に提案します。</p>
                </div>
            </div>

            <div class="plan-selection-section">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="currentLocation">📍 今どこにいますか？</label>
                    <input type="text" id="currentLocation" placeholder="例：新宿駅、横浜中華街">
                </div>

                <h2 class="selection-title" id="selectionTitle">今日はどうしますか？</h2>
                
                <div class="cards-grid" id="planCards"></div>

                <div class="memo-section">
                    <div class="memo-container">
                        <label for="userMemo" class="memo-label">📝 自分用メモ（自動保存）</label>
                        <textarea id="userMemo" class="memo-textarea" placeholder="入力すると自動的に保存されます..."></textarea>
                        
                        <div class="memo-actions">
                            <button id="memoDeleteBtn" class="btn-sm btn-delete">削除</button>
                        </div>
                    </div>
                </div>

                <div class="emergency-section">
                    <button id="modeToggleBtn" class="mode-btn mode-btn-danger" onclick="toggleEmergencyMode()">
                        <span id="modeEmoji" class="mode-btn-emoji">🚨</span>
                        <span class="mode-btn-text">
                            <span id="modeText">緊急モード</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // ==========================================
    // データ定義
    // ==========================================
    const normalModeCards = [
        { title: "今から１時間以内で行ける近場", emoji: "📍", situation: "near" },
        { title: "今日の気分", emoji: "😊", situation: "mood" },
        { title: "屋内プラン", emoji: "🏢", situation: "indoor" },
        { title: "あなたが今から行くべき場所", emoji: "🎲", situation: "random" }
    ];

    const emergencyModeCards = [
        { title: "30分でできること", emoji: "⏱️", situation: "quick" },
        { title: "充電ピンチ", emoji: "🔋", situation: "battery" }, 
        { title: "ドタキャンされた", emoji: "😢", situation: "cancel" }
    ];
//現在の状態を覚える変数
    let isEmergencyMode = false;
    const STORAGE_KEY_MEMO = 'planb_user_memo';

    // ログアウト
    function handleLogout() {
        console.log("ログアウトしました");
        window.location.href = 'login.html';
    }

    // カード描画
    function renderCards(cards) {
        const container = document.getElementById('planCards');
        container.innerHTML = '';
        
        // js-array (forEach), js-element (createElement) の知識
        cards.forEach(card => {
            const cardElement = document.createElement('div');
            cardElement.className = 'plan-card';
            cardElement.onclick = () => handleSelectPlan(card.situation);
            cardElement.innerHTML = `
                <span class="emoji">${card.emoji}</span>
                <h3>${card.title}</h3>
            `;
            container.appendChild(cardElement);
        });
    }

    // メモ帳機能
    function setupMemo() {
        const memoInput = document.getElementById('userMemo');
        const deleteBtn = document.getElementById('memoDeleteBtn');
        
        // js-storage (localStorage) の知識
        const savedMemo = localStorage.getItem(STORAGE_KEY_MEMO);
        if (savedMemo) {
            memoInput.value = savedMemo;
        }

        memoInput.addEventListener('input', () => {
            localStorage.setItem(STORAGE_KEY_MEMO, memoInput.value);
        });

        deleteBtn.addEventListener('click', () => {
            if (confirm("本当にメモを削除しますか？")) {
                localStorage.removeItem(STORAGE_KEY_MEMO);
                memoInput.value = "";
                alert("削除しました。");
            }
        });
    }

    // プラン選択時の処理
    function handleSelectPlan(situation) {
        const mapBaseUrl = "https://www.google.com/maps/search/?api=1&query=";
        
        // 画面のinputタグから現在地を取得
        const locationInput = document.getElementById('currentLocation');
        const locationName = locationInput.value;

        // 入力が空だった場合のチェック (js-conditional)
        if (locationName === "") {
            alert("「今どこにいますか？」の欄を入力してください！");
            return;
        }

        // 検索キーワードの決定
        let keyword = "";

        if (situation === 'mood') {
            const moodInput = window.prompt(
                "今の気分を番号で選んでください\n\n" +
                "1: 楽しい！もっと盛り上がりたい\n" +
                "2: 疲れた...ゆっくり癒やされたい\n" +
                "3: イライラ！ストレス発散したい"
            );

            // キャンセルされた場合
            if (!moodInput) return;

            // 分岐処理
            if (moodInput === '1') {
                keyword = "遊べる場所 アミューズメント";
            } else if (moodInput === '2') {
                keyword = "静かなカフェ 休憩";
            } else if (moodInput === '3') {
                keyword = "カラオケ ストレス発散";
            } else {
                keyword = "おすすめ";
            }

        } else if (situation === 'random') {
            const randomThemes = [
                "隠れ家カフェ", "人気のラーメン屋", "静かな公園", "美術館", 
                "神社", "レトロな純喫茶", "猫カフェ", "景色が綺麗な場所", 
                "ボウリング", "本屋", "雑貨屋", "ゲームセンター"
            ];
            const randomTheme = randomThemes[Math.floor(Math.random() * randomThemes.length)];
            
            alert("運命の決定🎲：\n\n次は「" + randomTheme + "」に行きましょう！");
            keyword = randomTheme;
        
        } else if (situation === 'near') {
            keyword = "観光スポット";
        
        } else if (situation === 'indoor') {
            keyword = "屋内 遊べる場所 水族館 映画館";
        
        } else if (situation === 'quick') {
            keyword = "カフェ 本屋 ファストフード 休憩";
        
        } else if (situation === 'battery') {
            keyword = "コンセント カフェ 充電";
        
        } else if (situation === 'cancel') {
            keyword = "一人 映画館 商業施設 スパ";
        }

        // クエリパラメータ: ?q=場所+キーワード
        const query = "?q=" + locationName + " " + keyword;
        window.location.href = mapBaseUrl + query;
    }

// 緊急モード切り替え
    function toggleEmergencyMode() {
        isEmergencyMode = !isEmergencyMode;
        
        const titleElement = document.getElementById('selectionTitle');
        const btnElement = document.getElementById('modeToggleBtn');
        const textElement = document.getElementById('modeText');
        const emojiElement = document.getElementById('modeEmoji');

        if (isEmergencyMode) {
            renderCards(emergencyModeCards);
            titleElement.textContent = "緊急サポート: 状況を選んでください";
            titleElement.style.color = "#dc2626";
            
            btnElement.classList.remove('mode-btn-danger');
            btnElement.classList.add('mode-btn-safe');
            
            textElement.textContent = "通常モードに戻る";
            emojiElement.textContent = "🏠";
        } else {
            renderCards(normalModeCards);
            titleElement.textContent = "どうしますか？";
            titleElement.style.color = "#1f2937";
            
            btnElement.classList.remove('mode-btn-safe');
            btnElement.classList.add('mode-btn-danger');
            
            textElement.textContent = "緊急モード";
            emojiElement.textContent = "🚨";
        }
    }

    // 初期化処理
    window.addEventListener('load', () => {
        renderCards(normalModeCards);
        setupMemo(); 
    });
</script>

</body>
</html>
